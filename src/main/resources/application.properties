spring.application.name=water-meter-service
spring.main.lazy-initialization=true
server.servlet.context-path=/
test.table.name=${TEST_TABLE_NAME:TestTable}
users.table.name=${USERS_TABLE_NAME:WaterMeterUsers}
tenants.table.name=${TENANTS_TABLE_NAME:WaterMeterTenants}
pre.enroll.table.name=${PRE_ENROLL_TABLE_NAME:WaterMeterDevicePreEnrollments}
units.table.name=${UNITS_TABLE_NAME:WaterMeterUnits}
device.state.table.name=${DEVICE_STATE_TABLE_NAME:WaterMeterDeviceState}
today.slots.table.name=${TODAY_SLOTS_TABLE_NAME:WaterMeterTodaySlots}
day.history.table.name=${DAY_HISTORY_TABLE_NAME:WaterMeterDayHistory}
device.config.table.name=${DEVICE_CONFIG_TABLE_NAME:WaterMeterDeviceConfig}
today.slots.ttl.hours=${TODAY_SLOTS_TTL_HOURS:72}
day.history.ttl.days=${DAY_HISTORY_TTL_DAYS:400}
mock.telemetry.enabled=${MOCK_TELEMETRY_ENABLED:true}
mock.history.backfill.days=${MOCK_HISTORY_BACKFILL_DAYS:30}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_vm19Xv95r}
logging.level.root=WARN
logging.level.com.vswitch.watermeter=INFO
logging.level.org.springframework=WARN
