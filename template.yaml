AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Water Meter Service - Spring Boot on AWS Lambda (redeploy)

Globals:
  Function:
    Timeout: 29
    MemorySize: 2048
    Runtime: java17

Resources:
  WaterMeterUsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterUsers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  WaterMeterTenantsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterTenants
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenantId
          AttributeType: S
      KeySchema:
        - AttributeName: tenantId
          KeyType: HASH

  WaterMeterDevicePreEnrollmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterDevicePreEnrollments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: serialNumber
          AttributeType: S
      KeySchema:
        - AttributeName: serialNumber
          KeyType: HASH

  WaterMeterUnitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterUnits
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: unitId
          AttributeType: S
        - AttributeName: tenantId
          AttributeType: S
      KeySchema:
        - AttributeName: unitId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: tenantId-index
          KeySchema:
            - AttributeName: tenantId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  WaterMeterDeviceStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterDeviceState
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH

  WaterMeterTodaySlotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterTodaySlots
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: slotKey
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
        - AttributeName: slotKey
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  WaterMeterDayHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterDayHistory
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: dayKey
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
        - AttributeName: dayKey
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  WaterMeterDeviceConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterDeviceConfig
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH

  WaterMeterServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.vswitch.watermeter.StreamLambdaHandler::handleRequest
      CodeUri: target/water-meter-service-0.0.1-SNAPSHOT-aws.jar
      Environment:
        Variables:
          TEST_TABLE_NAME: TestTable
          USERS_TABLE_NAME: WaterMeterUsers
          TENANTS_TABLE_NAME: WaterMeterTenants
          PRE_ENROLL_TABLE_NAME: WaterMeterDevicePreEnrollments
          UNITS_TABLE_NAME: WaterMeterUnits
          DEVICE_STATE_TABLE_NAME: WaterMeterDeviceState
          TODAY_SLOTS_TABLE_NAME: WaterMeterTodaySlots
          DAY_HISTORY_TABLE_NAME: WaterMeterDayHistory
          DEVICE_CONFIG_TABLE_NAME: WaterMeterDeviceConfig
          MOCK_TELEMETRY_ENABLED: "false"
          COGNITO_ISSUER_URI: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_vm19Xv95r
      Policies:
        - DynamoDBCrudPolicy:
            TableName: TestTable
        - DynamoDBCrudPolicy:
            TableName: WaterMeterUsers
        - DynamoDBCrudPolicy:
            TableName: WaterMeterTenants
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDevicePreEnrollments
        - DynamoDBCrudPolicy:
            TableName: WaterMeterUnits
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDeviceState
        - DynamoDBCrudPolicy:
            TableName: WaterMeterTodaySlots
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDayHistory
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDeviceConfig
      Events:
        ProxyApi:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: Api
          Properties:
            Path: /
            Method: ANY

  TelemetryIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.vswitch.watermeter.TelemetryIngestionLambdaHandler::handleRequest
      CodeUri: target/water-meter-service-0.0.1-SNAPSHOT-aws.jar
      Timeout: 120
      Environment:
        Variables:
          USERS_TABLE_NAME: WaterMeterUsers
          TENANTS_TABLE_NAME: WaterMeterTenants
          PRE_ENROLL_TABLE_NAME: WaterMeterDevicePreEnrollments
          UNITS_TABLE_NAME: WaterMeterUnits
          DEVICE_STATE_TABLE_NAME: WaterMeterDeviceState
          TODAY_SLOTS_TABLE_NAME: WaterMeterTodaySlots
          DAY_HISTORY_TABLE_NAME: WaterMeterDayHistory
          DEVICE_CONFIG_TABLE_NAME: WaterMeterDeviceConfig
          MOCK_TELEMETRY_ENABLED: "false"
          MOCK_HISTORY_BACKFILL_DAYS: "30"
          DAY_HISTORY_TTL_DAYS: "400"
          TODAY_SLOTS_TTL_HOURS: "72"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: WaterMeterUnits
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDeviceState
        - DynamoDBCrudPolicy:
            TableName: WaterMeterTodaySlots
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDayHistory
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDeviceConfig
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: false

  DeviceMqttIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.vswitch.watermeter.DeviceMqttLambdaHandler::handleRequest
      CodeUri: target/water-meter-service-0.0.1-SNAPSHOT-aws.jar
      Timeout: 30
      Environment:
        Variables:
          USERS_TABLE_NAME: WaterMeterUsers
          TENANTS_TABLE_NAME: WaterMeterTenants
          PRE_ENROLL_TABLE_NAME: WaterMeterDevicePreEnrollments
          UNITS_TABLE_NAME: WaterMeterUnits
          DEVICE_STATE_TABLE_NAME: WaterMeterDeviceState
          TODAY_SLOTS_TABLE_NAME: WaterMeterTodaySlots
          DAY_HISTORY_TABLE_NAME: WaterMeterDayHistory
          DEVICE_CONFIG_TABLE_NAME: WaterMeterDeviceConfig
          MOCK_TELEMETRY_ENABLED: "false"
          TODAY_SLOTS_TTL_HOURS: "72"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: WaterMeterUnits
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDevicePreEnrollments
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDeviceState
        - DynamoDBCrudPolicy:
            TableName: WaterMeterTodaySlots
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDeviceConfig

  DeviceMqttTopicRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: WaterMeterDeviceMqttIngest
      TopicRulePayload:
        AwsIotSqlVersion: "2016-03-23"
        Sql: "SELECT topic() as mqttTopic, encode(*, 'base64') as payloadBase64 FROM '+/water_meter/#'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt DeviceMqttIngestionFunction.Arn

  DeviceMqttLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DeviceMqttIngestionFunction
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rule/WaterMeterDeviceMqttIngest"

  DayRollupFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.vswitch.watermeter.DayRollupLambdaHandler::handleRequest
      CodeUri: target/water-meter-service-0.0.1-SNAPSHOT-aws.jar
      Timeout: 120
      Environment:
        Variables:
          USERS_TABLE_NAME: WaterMeterUsers
          TENANTS_TABLE_NAME: WaterMeterTenants
          PRE_ENROLL_TABLE_NAME: WaterMeterDevicePreEnrollments
          UNITS_TABLE_NAME: WaterMeterUnits
          DEVICE_STATE_TABLE_NAME: WaterMeterDeviceState
          TODAY_SLOTS_TABLE_NAME: WaterMeterTodaySlots
          DAY_HISTORY_TABLE_NAME: WaterMeterDayHistory
          DEVICE_CONFIG_TABLE_NAME: WaterMeterDeviceConfig
          DAY_HISTORY_TTL_DAYS: "400"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: WaterMeterUnits
        - DynamoDBCrudPolicy:
            TableName: WaterMeterTodaySlots
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDayHistory
      Events:
        DailyRollup:
          Type: Schedule
          Properties:
            Schedule: cron(5 0 * * ? *)
            Enabled: true

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
