AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Water Meter Service - Spring Boot on AWS Lambda (redeploy)

Globals:
  Function:
    Timeout: 29
    MemorySize: 2048
    Runtime: java17

Resources:
  WaterMeterUsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterUsers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  WaterMeterTenantsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterTenants
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenantId
          AttributeType: S
      KeySchema:
        - AttributeName: tenantId
          KeyType: HASH

  WaterMeterDevicePreEnrollmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterDevicePreEnrollments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: serialNumber
          AttributeType: S
      KeySchema:
        - AttributeName: serialNumber
          KeyType: HASH

  WaterMeterUnitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterUnits
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: unitId
          AttributeType: S
        - AttributeName: tenantId
          AttributeType: S
      KeySchema:
        - AttributeName: unitId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: tenantId-index
          KeySchema:
            - AttributeName: tenantId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  WaterMeterDeviceStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterDeviceState
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH

  WaterMeterMinuteUsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterMinuteUsage
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: minuteKey
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
        - AttributeName: minuteKey
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  WaterMeterDailyUsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterDailyUsage
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenantId
          AttributeType: S
        - AttributeName: usageKey
          AttributeType: S
      KeySchema:
        - AttributeName: tenantId
          KeyType: HASH
        - AttributeName: usageKey
          KeyType: RANGE

  WaterMeterDeviceConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterDeviceConfig
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH

  WaterMeterServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.vswitch.watermeter.StreamLambdaHandler::handleRequest
      CodeUri: target/water-meter-service-0.0.1-SNAPSHOT-aws.jar
      Environment:
        Variables:
          TEST_TABLE_NAME: TestTable
          USERS_TABLE_NAME: WaterMeterUsers
          TENANTS_TABLE_NAME: WaterMeterTenants
          PRE_ENROLL_TABLE_NAME: WaterMeterDevicePreEnrollments
          UNITS_TABLE_NAME: WaterMeterUnits
          DEVICE_STATE_TABLE_NAME: WaterMeterDeviceState
          MINUTE_USAGE_TABLE_NAME: WaterMeterMinuteUsage
          DAILY_USAGE_TABLE_NAME: WaterMeterDailyUsage
          DEVICE_CONFIG_TABLE_NAME: WaterMeterDeviceConfig
          COGNITO_ISSUER_URI: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_vm19Xv95r
      Policies:
        - DynamoDBCrudPolicy:
            TableName: TestTable
        - DynamoDBCrudPolicy:
            TableName: WaterMeterUsers
        - DynamoDBCrudPolicy:
            TableName: WaterMeterTenants
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDevicePreEnrollments
        - DynamoDBCrudPolicy:
            TableName: WaterMeterUnits
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDeviceState
        - DynamoDBCrudPolicy:
            TableName: WaterMeterMinuteUsage
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDailyUsage
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDeviceConfig
      Events:
        ProxyApi:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: Api
          Properties:
            Path: /
            Method: ANY

  TelemetryIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.vswitch.watermeter.TelemetryIngestionLambdaHandler::handleRequest
      CodeUri: target/water-meter-service-0.0.1-SNAPSHOT-aws.jar
      Timeout: 120
      Environment:
        Variables:
          USERS_TABLE_NAME: WaterMeterUsers
          TENANTS_TABLE_NAME: WaterMeterTenants
          PRE_ENROLL_TABLE_NAME: WaterMeterDevicePreEnrollments
          UNITS_TABLE_NAME: WaterMeterUnits
          DEVICE_STATE_TABLE_NAME: WaterMeterDeviceState
          MINUTE_USAGE_TABLE_NAME: WaterMeterMinuteUsage
          DAILY_USAGE_TABLE_NAME: WaterMeterDailyUsage
          DEVICE_CONFIG_TABLE_NAME: WaterMeterDeviceConfig
          MOCK_TELEMETRY_ENABLED: "true"
          MOCK_HISTORY_BACKFILL_DAYS: "10"
          MOCK_HISTORY_TTL_DAYS: "15"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: WaterMeterUnits
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDeviceState
        - DynamoDBCrudPolicy:
            TableName: WaterMeterMinuteUsage
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDailyUsage
        - DynamoDBCrudPolicy:
            TableName: WaterMeterDeviceConfig
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
