AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Water Meter Service - Spring Boot on AWS Lambda

Globals:
  Function:
    Timeout: 29
    MemorySize: 2048
    Runtime: java17

Resources:
  WaterMeterUsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterUsers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  WaterMeterTenantsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: WaterMeterTenants
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tenantId
          AttributeType: S
      KeySchema:
        - AttributeName: tenantId
          KeyType: HASH

  WaterMeterServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.vswitch.watermeter.StreamLambdaHandler::handleRequest
      CodeUri: target/water-meter-service-0.0.1-SNAPSHOT-aws.jar
      Environment:
        Variables:
          TEST_TABLE_NAME: TestTable
          USERS_TABLE_NAME: WaterMeterUsers
          TENANTS_TABLE_NAME: WaterMeterTenants
          COGNITO_ISSUER_URI: https://cognito-idp.ap-south-1.amazonaws.com/ap-south-1_vm19Xv95r
      Policies:
        - DynamoDBCrudPolicy:
            TableName: TestTable
        - DynamoDBCrudPolicy:
            TableName: WaterMeterUsers
        - DynamoDBCrudPolicy:
            TableName: WaterMeterTenants
      Events:
        ProxyApi:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: Api
          Properties:
            Path: /
            Method: ANY

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
