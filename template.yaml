AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Water Meter Service - Spring Boot on AWS Lambda

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: java17

Resources:
  WaterMeterServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.vswitch.watermeter.StreamLambdaHandler::handleRequest
      CodeUri: target/water-meter-service-0.0.1-SNAPSHOT-aws.jar
      Events:
        ProxyApi:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootApi:
          Type: Api
          Properties:
            Path: /
            Method: ANY

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/testlamda'
